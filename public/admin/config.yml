backend:
  name: github
  repo: williscool/boujeehacker.com

media_folder: public/img
public_folder: /img

display_url: https://boujeehacker.com/

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/about/index.md"
        label: "About"
        name: "about"
        fields:
          - { label: "Template Key", name: "templateKey", widget: "hidden", default: "about-page" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown", hint: "The credibility arc — career, projects, story. The identity line at the top of the page is sourced from the Home collection." }
          - {
              label: "SEO & Meta",
              name: "seo",
              widget: "object",
              fields:
                [
                  { label: "Browser Tab Title", name: "browserTitle", widget: "string"},
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Description", name: "description", widget: "string" },
                ],
            }
      - file: "src/content/home/index.md"
        label: "Home"
        name: "home"
        fields:
          - { label: "Template Key", name: "templateKey", widget: "hidden", default: "home-page" }
          - {
              label: "Avatar",
              name: "avatar",
              widget: "object",
              required: false,
              hint: "Small headshot rendered above the identity line.",
              fields:
                [
                  { label: "Image", name: "image", widget: "image" },
                  { label: "Image Description", name: "imageAlt", widget: "string" },
                ],
            }
          - {
              label: "Identity Line",
              name: "identityLine",
              widget: "markdown",
              hint: "Single line. Inline links allowed. No bold. Renders as the headline.",
              buttons: [italic, link],
            }
          - {
              label: "Selected Work",
              name: "selectedWork",
              widget: "list",
              min: 1,
              max: 6,
              fields:
                [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Outcome", name: "outcome", widget: "string", hint: "One short line, outcome-first." },
                  { label: "URL", name: "url", widget: "string" },
                ],
            }
          - {
              label: "Now Line",
              name: "nowLine",
              widget: "markdown",
              hint: "What you're currently doing. One short line. Keep it genuinely current.",
              buttons: [italic, link],
            }
          - {
              label: "Primary CTA",
              name: "primaryCTA",
              widget: "object",
              fields:
                [
                  { label: "Label", name: "label", widget: "string", hint: "e.g. 'Work with me'" },
                  { label: "URL", name: "url", widget: "string", hint: "e.g. /work-together" },
                ],
            }
          - {
              label: "Social Links",
              name: "socialLinks",
              widget: "list",
              fields:
                [
                  { label: "Label", name: "label", widget: "string" },
                  { label: "URL", name: "url", widget: "string" },
                ],
            }
          - {
              label: "SEO & Meta",
              name: "seo",
              widget: "object",
              fields:
                [
                  { label: "Browser Tab Title", name: "browserTitle", widget: "string"},
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Description", name: "description", widget: "string" },
                  { label: "Keywords", name: "keywords", widget: "string" },
                ],
            }
      - file: "src/content/work-together/index.md"
        label: "Work Together"
        name: "work-together"
        fields:
          - { label: "Template Key", name: "templateKey", widget: "hidden", default: "work-together" }
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "ICP Line",
              name: "icpLine",
              widget: "markdown",
              hint: "The single benefit-first headline. e.g. 'I rescue profitable AI-built apps from the last-20% death spiral.'",
              buttons: [italic, link],
            }
          - {
              label: "Deck URL",
              name: "deckUrl",
              widget: "string",
              required: false,
              hint: "Optional link to the longer pitch deck (Google Slides, etc).",
            }
          - { label: "Body", name: "body", widget: "markdown", hint: "Benefit-first explanation. What you do, who it's for, what they get." }
          - {
              label: "SEO & Meta",
              name: "seo",
              widget: "object",
              fields:
                [
                  { label: "Browser Tab Title", name: "browserTitle", widget: "string"},
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Description", name: "description", widget: "string" },
                ],
            }
  - name: "navbarAndFooter"
    label: "Navbar & Footer"
    files:
      - file: "src/content/navbar/index.md"
        label: "Navbar"
        name: "navbar"
        fields:
          - { label: "Template Key", name: "templateKey", widget: "hidden", default: "navbar" }
          - {
              label: "Menu Items",
              name: "menuItems",
              widget: "list",
              fields:
                [
                  { label: "Label", name: "label", widget: "string" },
                  { label: "Link Type", name: "linkType", widget: "select", options: ["internal", "external"] },
                  { label: "Link URL", name: "linkURL", widget: "string", hint: "Use a relative URL (e.g. /about) if the link is an internal link." },
                ],
            }
      - file: "src/content/footer/index.md"
        label: "Footer"
        name: "footer"
        fields:
          - { label: "Template Key", name: "templateKey", widget: "hidden", default: "footer" }
          - {
              label: "Logo Image & Tagline",
              name: "logoImage",
              widget: "object",
              fields:
                [
                  { label: "Image", name: "image", widget: "image" },
                  { label: "Image Description", name: "imageAlt", widget: "string" },
                  { label: "Tagline", name: "tagline", widget: "string" },
                ],
            }
          - {
              label: "Social Links",
              name: "footerLinks",
              widget: "list",
              fields:
                [
                  { label: "Image", name: "image", widget: "image" },
                  { label: "Image Description", name: "imageAlt", widget: "string" },
                  { label: "Label", name: "label", widget: "string" },
                  { label: "Link URL", name: "linkURL", widget: "string" },
                ],
            }